name: MYRIAD v3.4 fresh checkpoint training qualification
on:
  pull_request:
    paths:
      - 'scripts/evolution_fresh_training_v34.py'
      - 'tests/test_evolution_fresh_training_v34.py'
      - '.github/workflows/myriad-fresh-training-v34-ci.yml'
permissions:
  contents: read
jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_evolution_fresh_training_v34.py' -v
