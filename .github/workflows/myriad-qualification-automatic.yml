      - run: python -m unittest discover -s tests -p 'test_evolution_supervisor_v50.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_observatory_live_v52.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_continuous_v53.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_collective_v54.py' -v
  banks-v54:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
    steps:
