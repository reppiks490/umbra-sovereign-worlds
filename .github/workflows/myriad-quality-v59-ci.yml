name: MYRIAD v5.5-v5.9 integrity and training quality
on:
  pull_request:
    paths:
      - 'scripts/evolution_*v5[5-9].py'
      - 'scripts/evolution_fleet_v46.py'
      - 'scripts/evolution_supervisor_v50.py'
      - 'scripts/publish_telemetry_v48.py'
      - 'tests/test_evolution_*v5[5-9].py'
      - '.github/workflows/myriad-quality-v59-ci.yml'
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_evolution_fleet_v46.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_collective_v54.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_fleet_integrity_v55.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_algorithms_v56.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_quality_supervisor_v59.py' -v
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_evolution_algorithm_distill_v57.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_agent_evolution_v58.py' -v
