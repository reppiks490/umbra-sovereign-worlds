name: MYRIAD v4.6-v5.4 fleet, banks, algorithms and observability
on:
  pull_request:
    paths:
      - 'scripts/evolution_*v4[6-9].py'
      - 'scripts/evolution_*v5[0-4].py'
      - 'scripts/publish_telemetry_v48.py'
      - 'tests/test_evolution_*v4[6-9].py'
      - 'tests/test_evolution_*v5[0-4].py'
      - '.github/workflows/myriad-scale-v54-ci.yml'
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_evolution_fleet_v46.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_telemetry_v48.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_algorithms_v49.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_supervisor_v50.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_observatory_live_v52.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_continuous_v53.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_collective_v54.py' -v
  banks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_evolution_bank_v47.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_agent_bank_v51.py' -v
