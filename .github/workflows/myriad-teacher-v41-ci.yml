name: MYRIAD v4.0-v4.2 teacher and retrieval qualification
on:
  pull_request:
    paths:
      - 'scripts/evolution_teacher_v40.py'
      - 'scripts/evolution_teacher_supervisor_v41.py'
      - 'scripts/evolution_retrieval_review_v42.py'
      - 'tests/test_evolution_teacher*v4*.py'
      - 'tests/test_evolution_retrieval_review_v42.py'
      - '.github/workflows/myriad-teacher-v41-ci.yml'
permissions:
  contents: read
jobs:
  teacher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_evolution_teacher_v40.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_teacher_supervisor_v41.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_retrieval_review_v42.py' -v
