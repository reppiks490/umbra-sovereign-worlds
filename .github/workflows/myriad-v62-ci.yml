name: MYRIAD v6.0-v6.2 algorithms, retention and paired qualification
on:
  pull_request:
    paths:
      - 'scripts/evolution_algorithms_v60.py'
      - 'scripts/evolution_task_adapter_v61.py'
      - 'scripts/evolution_adapter_stress_v77.py'
      - 'tests/test_evolution_adapter_stress_v77.py'
      - 'scripts/evolution_adapter_intervention_v80.py'
      - 'tests/test_evolution_adapter_intervention_v80.py'
      - 'scripts/evolution_novel_reasoning_v81.py'
      - 'tests/test_evolution_novel_reasoning_v81.py'
      - 'scripts/evolution_reasoning_runtime_v82.py'
      - 'tests/test_evolution_reasoning_runtime_v82.py'
      - 'scripts/evolution_group_robust_v83.py'
      - 'tests/test_evolution_group_robust_v83.py'
      - 'scripts/evolution_proof_curriculum_v84.py'
      - 'tests/test_evolution_proof_curriculum_v84.py'
      - 'scripts/evolution_model_tournament_v62.py'
      - 'scripts/evolution_quality_supervisor_v59.py'
      - 'tests/test_evolution_*v6[0-2].py'
      - '.github/workflows/myriad-v62-ci.yml'
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_evolution_algorithms_v60.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_model_tournament_v62.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_novel_reasoning_v81.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_reasoning_runtime_v82.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_group_robust_v83.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_proof_curriculum_v84.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_quality_supervisor_v59.py' -v
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_evolution_task_adapter_v61.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_adapter_stress_v77.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_adapter_intervention_v80.py' -v
