name: MYRIAD v6.3-v6.6 distillation, tool execution and resource admission
on:
  pull_request:
    paths:
      - 'scripts/evolution_distill_v63.py'
      - 'scripts/evolution_tool_research_v64.py'
      - 'scripts/evolution_window_claim_v96.py'
      - 'tests/test_evolution_window_claim_v96.py'
      - 'scripts/evolution_algorithms_v65.py'
      - 'scripts/evolution_quality_supervisor_v59.py'
      - 'tests/test_evolution_*v6[3-6].py'
      - '.github/workflows/myriad-v66-ci.yml'
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_evolution_tool_research_v64.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_window_claim_v96.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_algorithms_v65.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_resource_v66.py' -v
      - run: python -m unittest discover -s tests -p 'test_evolution_quality_supervisor_v59.py' -v
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_evolution_distill_v63.py' -v
