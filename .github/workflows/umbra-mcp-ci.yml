name: UMBRA native compute MCP qualification
on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'tests/mcp-*.test.mjs'
      - '.github/workflows/umbra-mcp-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mcp-protocol.test.mjs tests/mcp-runtime.test.mjs
