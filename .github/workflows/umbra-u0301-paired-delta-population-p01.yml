# UMBRA U0301 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0301 | T4 causal-inference | paired-delta | population | precision 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0301-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0301 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0301 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0301-evidence"
          path: advanced-evidence/U0301.json
          if-no-files-found: error
          retention-days: 7
