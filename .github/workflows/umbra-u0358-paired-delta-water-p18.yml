# UMBRA U0358 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0358 | T4 causal-inference | paired-delta | water | adversarial 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0358-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0358 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0358 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0358-evidence"
          path: advanced-evidence/U0358.json
          if-no-files-found: error
          retention-days: 7
