# UMBRA U0395 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0395 | T4 causal-inference | paired-delta | wealth | long-horizon 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0395-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0395 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0395 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0395-evidence"
          path: advanced-evidence/U0395.json
          if-no-files-found: error
          retention-days: 7
