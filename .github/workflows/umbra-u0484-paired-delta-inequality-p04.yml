# UMBRA U0484 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0484 | T4 causal-inference | paired-delta | inequality | precision 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0484-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0484 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0484 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0484-evidence"
          path: advanced-evidence/U0484.json
          if-no-files-found: error
          retention-days: 7
