# UMBRA U0525 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0525 | T4 causal-inference | dose-gradient | food | boundary 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0525-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0525 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0525 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0525-evidence"
          path: advanced-evidence/U0525.json
          if-no-files-found: error
          retention-days: 7
