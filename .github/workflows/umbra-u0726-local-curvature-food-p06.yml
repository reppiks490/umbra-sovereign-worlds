# UMBRA U0726 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0726 | T4 causal-inference | local-curvature | food | boundary 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0726-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0726 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0726 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0726-evidence"
          path: advanced-evidence/U0726.json
          if-no-files-found: error
          retention-days: 7
