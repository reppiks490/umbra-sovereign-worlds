# UMBRA U0747 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0747 | T4 causal-inference | local-curvature | water | boundary 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0747-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0747 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0747 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0747-evidence"
          path: advanced-evidence/U0747.json
          if-no-files-found: error
          retention-days: 7
