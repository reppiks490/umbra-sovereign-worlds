# UMBRA U0788 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0788 | T4 causal-inference | local-curvature | wealth | boundary 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0788-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0788 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0788 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0788-evidence"
          path: advanced-evidence/U0788.json
          if-no-files-found: error
          retention-days: 7
