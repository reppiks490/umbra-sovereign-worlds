# UMBRA Ω / U088: manually invoked synthetic research. No automatic deployment or trading.
name: 'U088 | VERIFICATION / Reality Court / Stress'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 'umbra-u088-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Execute U088 evidence case'
        run: 'node scripts/umbra_lab.mjs --id U088 --out-dir workflow-artifacts'
      - name: Upload synthetic evidence (not independent scientific validation)
        uses: actions/upload-artifact@v4
        with:
          name: 'umbra-u088-synthetic-evidence'
          path: 'workflow-artifacts/U088.json'
          if-no-files-found: error
          retention-days: 14
