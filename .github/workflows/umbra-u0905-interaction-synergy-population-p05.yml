# UMBRA U0905 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0905 | T4 causal-inference | interaction-synergy | population | boundary 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0905-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0905 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0905 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0905-evidence"
          path: advanced-evidence/U0905.json
          if-no-files-found: error
          retention-days: 7
