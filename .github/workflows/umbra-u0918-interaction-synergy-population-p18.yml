# UMBRA U0918 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0918 | T4 causal-inference | interaction-synergy | population | adversarial 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0918-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0918 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0918 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0918-evidence"
          path: advanced-evidence/U0918.json
          if-no-files-found: error
          retention-days: 7
