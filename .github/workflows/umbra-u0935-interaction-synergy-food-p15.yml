# UMBRA U0935 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U0935 | T4 causal-inference | interaction-synergy | food | long-horizon 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u0935-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U0935 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U0935 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u0935-evidence"
          path: advanced-evidence/U0935.json
          if-no-files-found: error
          retention-days: 7
