# UMBRA U1010 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1010 | T4 causal-inference | interaction-synergy | knowledge | regime-shift 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1010-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1010 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1010 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1010-evidence"
          path: advanced-evidence/U1010.json
          if-no-files-found: error
          retention-days: 7
