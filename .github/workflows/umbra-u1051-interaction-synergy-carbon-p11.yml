# UMBRA U1051 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1051 | T4 causal-inference | interaction-synergy | carbon | regime-shift 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1051-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1051 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1051 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1051-evidence"
          path: advanced-evidence/U1051.json
          if-no-files-found: error
          retention-days: 7
