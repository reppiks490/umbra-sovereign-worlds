# UMBRA U1063 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1063 | T4 causal-inference | interaction-synergy | biodiversity | precision 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1063-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1063 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1063 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1063-evidence"
          path: advanced-evidence/U1063.json
          if-no-files-found: error
          retention-days: 7
