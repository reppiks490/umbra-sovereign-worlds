# UMBRA U1309 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1309 | T5 adversarial-resilience | shock-recovery | population | regime-shift 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1309-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1309 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1309 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1309-evidence"
          path: advanced-evidence/U1309.json
          if-no-files-found: error
          retention-days: 7
