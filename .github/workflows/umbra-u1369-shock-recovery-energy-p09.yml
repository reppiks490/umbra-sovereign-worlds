# UMBRA U1369 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1369 | T5 adversarial-resilience | shock-recovery | energy | regime-shift 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1369-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1369 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1369 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1369-evidence"
          path: advanced-evidence/U1369.json
          if-no-files-found: error
          retention-days: 7
