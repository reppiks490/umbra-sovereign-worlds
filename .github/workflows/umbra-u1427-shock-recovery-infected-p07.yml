# UMBRA U1427 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1427 | T5 adversarial-resilience | shock-recovery | infected | boundary 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1427-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1427 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1427 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1427-evidence"
          path: advanced-evidence/U1427.json
          if-no-files-found: error
          retention-days: 7
