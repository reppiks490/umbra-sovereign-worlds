# UMBRA U1451 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1451 | T5 adversarial-resilience | shock-recovery | carbon | regime-shift 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1451-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1451 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1451 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1451-evidence"
          path: advanced-evidence/U1451.json
          if-no-files-found: error
          retention-days: 7
