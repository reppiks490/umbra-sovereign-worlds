# UMBRA U1548 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1548 | T5 adversarial-resilience | cvar-tail-risk | water | boundary 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1548-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1548 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1548 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1548-evidence"
          path: advanced-evidence/U1548.json
          if-no-files-found: error
          retention-days: 7
