# UMBRA U1691 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1691 | T5 adversarial-resilience | cvar-tail-risk | inequality | regime-shift 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1691-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1691 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1691 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1691-evidence"
          path: advanced-evidence/U1691.json
          if-no-files-found: error
          retention-days: 7
