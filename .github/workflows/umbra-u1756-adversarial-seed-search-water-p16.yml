# UMBRA U1756 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1756 | T5 adversarial-resilience | adversarial-seed-search | water | long-horizon 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1756-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1756 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1756 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1756-evidence"
          path: advanced-evidence/U1756.json
          if-no-files-found: error
          retention-days: 7
