# UMBRA U1779 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1779 | T5 adversarial-resilience | adversarial-seed-search | energy | adversarial 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1779-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1779 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1779 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1779-evidence"
          path: advanced-evidence/U1779.json
          if-no-files-found: error
          retention-days: 7
