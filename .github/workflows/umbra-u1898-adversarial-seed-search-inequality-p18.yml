# UMBRA U1898 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1898 | T5 adversarial-resilience | adversarial-seed-search | inequality | adversarial 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1898-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1898 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1898 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1898-evidence"
          path: advanced-evidence/U1898.json
          if-no-files-found: error
          retention-days: 7
