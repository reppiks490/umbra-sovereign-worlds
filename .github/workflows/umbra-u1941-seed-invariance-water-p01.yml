# UMBRA U1941 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U1941 | T5 adversarial-resilience | seed-invariance | water | precision 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u1941-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U1941 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U1941 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u1941-evidence"
          path: advanced-evidence/U1941.json
          if-no-files-found: error
          retention-days: 7
