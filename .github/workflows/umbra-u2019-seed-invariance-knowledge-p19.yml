# UMBRA U2019 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2019 | T5 adversarial-resilience | seed-invariance | knowledge | adversarial 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2019-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2019 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2019 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2019-evidence"
          path: advanced-evidence/U2019.json
          if-no-files-found: error
          retention-days: 7
