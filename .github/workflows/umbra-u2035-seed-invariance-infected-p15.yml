# UMBRA U2035 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2035 | T5 adversarial-resilience | seed-invariance | infected | long-horizon 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2035-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2035 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2035 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2035-evidence"
          path: advanced-evidence/U2035.json
          if-no-files-found: error
          retention-days: 7
