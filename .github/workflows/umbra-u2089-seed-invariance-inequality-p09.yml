# UMBRA U2089 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2089 | T5 adversarial-resilience | seed-invariance | inequality | regime-shift 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2089-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2089 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2089 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2089-evidence"
          path: advanced-evidence/U2089.json
          if-no-files-found: error
          retention-days: 7
