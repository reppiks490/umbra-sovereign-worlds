# UMBRA U2134 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2134 | T5 adversarial-resilience | multi-horizon-stability | food | long-horizon 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2134-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2134 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2134 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2134-evidence"
          path: advanced-evidence/U2134.json
          if-no-files-found: error
          retention-days: 7
