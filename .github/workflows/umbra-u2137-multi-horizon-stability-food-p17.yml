# UMBRA U2137 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2137 | T5 adversarial-resilience | multi-horizon-stability | food | adversarial 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2137-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2137 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2137 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2137-evidence"
          path: advanced-evidence/U2137.json
          if-no-files-found: error
          retention-days: 7
