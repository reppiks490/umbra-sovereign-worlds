# UMBRA U2235 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2235 | T5 adversarial-resilience | multi-horizon-stability | infected | long-horizon 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2235-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2235 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2235 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2235-evidence"
          path: advanced-evidence/U2235.json
          if-no-files-found: error
          retention-days: 7
