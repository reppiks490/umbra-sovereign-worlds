# UMBRA U2237 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2237 | T5 adversarial-resilience | multi-horizon-stability | infected | adversarial 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2237-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2237 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2237 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2237-evidence"
          path: advanced-evidence/U2237.json
          if-no-files-found: error
          retention-days: 7
