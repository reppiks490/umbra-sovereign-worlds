# UMBRA U2259 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2259 | T5 adversarial-resilience | multi-horizon-stability | carbon | adversarial 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2259-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2259 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2259 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2259-evidence"
          path: advanced-evidence/U2259.json
          if-no-files-found: error
          retention-days: 7
