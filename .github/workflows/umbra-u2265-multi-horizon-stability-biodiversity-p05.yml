# UMBRA U2265 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2265 | T5 adversarial-resilience | multi-horizon-stability | biodiversity | boundary 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2265-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2265 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2265 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2265-evidence"
          path: advanced-evidence/U2265.json
          if-no-files-found: error
          retention-days: 7
