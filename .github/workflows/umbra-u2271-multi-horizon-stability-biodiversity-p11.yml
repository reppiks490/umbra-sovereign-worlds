# UMBRA U2271 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2271 | T5 adversarial-resilience | multi-horizon-stability | biodiversity | regime-shift 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2271-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2271 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2271 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2271-evidence"
          path: advanced-evidence/U2271.json
          if-no-files-found: error
          retention-days: 7
