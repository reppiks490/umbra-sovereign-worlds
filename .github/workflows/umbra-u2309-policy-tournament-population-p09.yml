# UMBRA U2309 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2309 | T6 evolutionary-search | policy-tournament | population | regime-shift 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2309-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2309 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2309 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2309-evidence"
          path: advanced-evidence/U2309.json
          if-no-files-found: error
          retention-days: 7
