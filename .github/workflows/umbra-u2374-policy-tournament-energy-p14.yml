# UMBRA U2374 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2374 | T6 evolutionary-search | policy-tournament | energy | long-horizon 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2374-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2374 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2374 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2374-evidence"
          path: advanced-evidence/U2374.json
          if-no-files-found: error
          retention-days: 7
