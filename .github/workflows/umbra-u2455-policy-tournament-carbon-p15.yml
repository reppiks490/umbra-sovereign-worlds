# UMBRA U2455 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2455 | T6 evolutionary-search | policy-tournament | carbon | long-horizon 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2455-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2455 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2455 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2455-evidence"
          path: advanced-evidence/U2455.json
          if-no-files-found: error
          retention-days: 7
