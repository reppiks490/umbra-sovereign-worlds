# UMBRA U2458 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2458 | T6 evolutionary-search | policy-tournament | carbon | adversarial 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2458-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2458 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2458 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2458-evidence"
          path: advanced-evidence/U2458.json
          if-no-files-found: error
          retention-days: 7
