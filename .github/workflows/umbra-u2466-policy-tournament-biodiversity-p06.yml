# UMBRA U2466 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2466 | T6 evolutionary-search | policy-tournament | biodiversity | boundary 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2466-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2466 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2466 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2466-evidence"
          path: advanced-evidence/U2466.json
          if-no-files-found: error
          retention-days: 7
