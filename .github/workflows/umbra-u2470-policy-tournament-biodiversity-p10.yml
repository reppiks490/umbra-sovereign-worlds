# UMBRA U2470 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2470 | T6 evolutionary-search | policy-tournament | biodiversity | regime-shift 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2470-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2470 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2470 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2470-evidence"
          path: advanced-evidence/U2470.json
          if-no-files-found: error
          retention-days: 7
