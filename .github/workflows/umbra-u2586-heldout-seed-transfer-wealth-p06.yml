# UMBRA U2586 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2586 | T6 evolutionary-search | heldout-seed-transfer | wealth | boundary 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2586-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2586 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2586 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2586-evidence"
          path: advanced-evidence/U2586.json
          if-no-files-found: error
          retention-days: 7
