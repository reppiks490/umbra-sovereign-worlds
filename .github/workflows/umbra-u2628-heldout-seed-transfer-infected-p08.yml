# UMBRA U2628 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2628 | T6 evolutionary-search | heldout-seed-transfer | infected | boundary 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2628-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2628 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2628 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2628-evidence"
          path: advanced-evidence/U2628.json
          if-no-files-found: error
          retention-days: 7
