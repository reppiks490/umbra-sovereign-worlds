# UMBRA U2688 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2688 | T6 evolutionary-search | heldout-seed-transfer | inequality | boundary 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2688-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2688 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2688 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2688-evidence"
          path: advanced-evidence/U2688.json
          if-no-files-found: error
          retention-days: 7
