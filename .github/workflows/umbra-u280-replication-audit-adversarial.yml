# UMBRA Ω / U280: manually invoked synthetic research. No automatic deployment or trading.
name: 'U280 | EVOLUTION / Replication Audit / Adversarial'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 'umbra-u280-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Execute U280 evidence case'
        run: 'node scripts/umbra_lab.mjs --id U280 --out-dir workflow-artifacts'
      - name: Upload synthetic evidence (not independent scientific validation)
        uses: actions/upload-artifact@v4
        with:
          name: 'umbra-u280-synthetic-evidence'
          path: 'workflow-artifacts/U280.json'
          if-no-files-found: error
          retention-days: 14
