# UMBRA U2816 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2816 | T6 evolutionary-search | bounded-mutation | knowledge | long-horizon 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2816-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2816 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2816 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2816-evidence"
          path: advanced-evidence/U2816.json
          if-no-files-found: error
          retention-days: 7
