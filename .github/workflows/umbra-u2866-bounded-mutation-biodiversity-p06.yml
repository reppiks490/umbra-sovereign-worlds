# UMBRA U2866 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2866 | T6 evolutionary-search | bounded-mutation | biodiversity | boundary 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2866-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2866 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2866 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2866-evidence"
          path: advanced-evidence/U2866.json
          if-no-files-found: error
          retention-days: 7
