# UMBRA U2929 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2929 | T6 evolutionary-search | pareto-frontier | food | regime-shift 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2929-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2929 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2929 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2929-evidence"
          path: advanced-evidence/U2929.json
          if-no-files-found: error
          retention-days: 7
