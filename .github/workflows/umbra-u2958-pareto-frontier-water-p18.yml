# UMBRA U2958 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U2958 | T6 evolutionary-search | pareto-frontier | water | adversarial 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u2958-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U2958 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U2958 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u2958-evidence"
          path: advanced-evidence/U2958.json
          if-no-files-found: error
          retention-days: 7
