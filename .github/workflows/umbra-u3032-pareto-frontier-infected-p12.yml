# UMBRA U3032 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3032 | T6 evolutionary-search | pareto-frontier | infected | regime-shift 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3032-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3032 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3032 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3032-evidence"
          path: advanced-evidence/U3032.json
          if-no-files-found: error
          retention-days: 7
