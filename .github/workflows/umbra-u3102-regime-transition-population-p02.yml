# UMBRA U3102 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3102 | T6 evolutionary-search | regime-transition | population | precision 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3102-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3102 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3102 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3102-evidence"
          path: advanced-evidence/U3102.json
          if-no-files-found: error
          retention-days: 7
