# UMBRA U3123 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3123 | T6 evolutionary-search | regime-transition | food | precision 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3123-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3123 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3123 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3123-evidence"
          path: advanced-evidence/U3123.json
          if-no-files-found: error
          retention-days: 7
