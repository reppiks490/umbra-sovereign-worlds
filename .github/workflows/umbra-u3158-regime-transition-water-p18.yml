# UMBRA U3158 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3158 | T6 evolutionary-search | regime-transition | water | adversarial 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3158-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3158 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3158 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3158-evidence"
          path: advanced-evidence/U3158.json
          if-no-files-found: error
          retention-days: 7
