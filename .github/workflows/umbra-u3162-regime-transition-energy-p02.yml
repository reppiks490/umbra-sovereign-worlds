# UMBRA U3162 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3162 | T6 evolutionary-search | regime-transition | energy | precision 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3162-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3162 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3162 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3162-evidence"
          path: advanced-evidence/U3162.json
          if-no-files-found: error
          retention-days: 7
