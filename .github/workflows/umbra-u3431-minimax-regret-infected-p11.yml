# UMBRA U3431 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3431 | T7 sovereign-optimization | minimax-regret | infected | regime-shift 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3431-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3431 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3431 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3431-evidence"
          path: advanced-evidence/U3431.json
          if-no-files-found: error
          retention-days: 7
