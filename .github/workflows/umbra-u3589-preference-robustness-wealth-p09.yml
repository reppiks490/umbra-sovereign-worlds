# UMBRA U3589 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3589 | T7 sovereign-optimization | preference-robustness | wealth | regime-shift 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3589-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3589 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3589 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3589-evidence"
          path: advanced-evidence/U3589.json
          if-no-files-found: error
          retention-days: 7
