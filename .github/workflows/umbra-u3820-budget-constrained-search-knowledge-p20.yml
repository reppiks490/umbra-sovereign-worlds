# UMBRA U3820 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3820 | T7 sovereign-optimization | budget-constrained-search | knowledge | adversarial 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3820-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3820 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3820 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3820-evidence"
          path: advanced-evidence/U3820.json
          if-no-files-found: error
          retention-days: 7
