# UMBRA U3844 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3844 | T7 sovereign-optimization | budget-constrained-search | carbon | precision 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3844-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3844 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3844 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3844-evidence"
          path: advanced-evidence/U3844.json
          if-no-files-found: error
          retention-days: 7
