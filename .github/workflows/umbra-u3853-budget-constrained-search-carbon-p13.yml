# UMBRA U3853 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3853 | T7 sovereign-optimization | budget-constrained-search | carbon | long-horizon 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3853-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3853 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3853 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3853-evidence"
          path: advanced-evidence/U3853.json
          if-no-files-found: error
          retention-days: 7
