# UMBRA U3859 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3859 | T7 sovereign-optimization | budget-constrained-search | carbon | adversarial 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3859-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3859 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3859 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3859-evidence"
          path: advanced-evidence/U3859.json
          if-no-files-found: error
          retention-days: 7
