# UMBRA U3906 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3906 | T7 sovereign-optimization | regional-fairness | population | boundary 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3906-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3906 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3906 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3906-evidence"
          path: advanced-evidence/U3906.json
          if-no-files-found: error
          retention-days: 7
