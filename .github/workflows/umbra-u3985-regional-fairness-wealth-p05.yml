# UMBRA U3985 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U3985 | T7 sovereign-optimization | regional-fairness | wealth | boundary 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u3985-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U3985 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U3985 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u3985-evidence"
          path: advanced-evidence/U3985.json
          if-no-files-found: error
          retention-days: 7
