# UMBRA U4105 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4105 | T7 sovereign-optimization | composite-utility | population | boundary 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4105-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4105 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4105 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4105-evidence"
          path: advanced-evidence/U4105.json
          if-no-files-found: error
          retention-days: 7
