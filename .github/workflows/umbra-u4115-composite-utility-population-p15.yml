# UMBRA U4115 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4115 | T7 sovereign-optimization | composite-utility | population | long-horizon 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4115-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4115 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4115 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4115-evidence"
          path: advanced-evidence/U4115.json
          if-no-files-found: error
          retention-days: 7
