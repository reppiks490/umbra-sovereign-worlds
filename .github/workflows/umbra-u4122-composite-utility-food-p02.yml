# UMBRA U4122 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4122 | T7 sovereign-optimization | composite-utility | food | precision 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4122-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4122 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4122 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4122-evidence"
          path: advanced-evidence/U4122.json
          if-no-files-found: error
          retention-days: 7
