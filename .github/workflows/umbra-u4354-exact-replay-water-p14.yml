# UMBRA U4354 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4354 | T8 metascience | exact-replay | water | long-horizon 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4354-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4354 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4354 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4354-evidence"
          path: advanced-evidence/U4354.json
          if-no-files-found: error
          retention-days: 7
