# UMBRA U4369 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4369 | T8 metascience | exact-replay | energy | regime-shift 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4369-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4369 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4369 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4369-evidence"
          path: advanced-evidence/U4369.json
          if-no-files-found: error
          retention-days: 7
