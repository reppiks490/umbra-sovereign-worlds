# UMBRA U4432 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4432 | T8 metascience | exact-replay | infected | regime-shift 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4432-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4432 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4432 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4432-evidence"
          path: advanced-evidence/U4432.json
          if-no-files-found: error
          retention-days: 7
