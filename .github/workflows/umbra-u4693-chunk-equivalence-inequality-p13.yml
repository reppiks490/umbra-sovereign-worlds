# UMBRA U4693 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4693 | T8 metascience | chunk-equivalence | inequality | long-horizon 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4693-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4693 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4693 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4693-evidence"
          path: advanced-evidence/U4693.json
          if-no-files-found: error
          retention-days: 7
