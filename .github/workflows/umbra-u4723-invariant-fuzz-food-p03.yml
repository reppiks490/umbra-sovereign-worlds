# UMBRA U4723 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4723 | T8 metascience | invariant-fuzz | food | precision 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4723-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4723 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4723 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4723-evidence"
          path: advanced-evidence/U4723.json
          if-no-files-found: error
          retention-days: 7
