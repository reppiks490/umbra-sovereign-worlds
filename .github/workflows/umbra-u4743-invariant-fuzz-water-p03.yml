# UMBRA U4743 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4743 | T8 metascience | invariant-fuzz | water | precision 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4743-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4743 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4743 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4743-evidence"
          path: advanced-evidence/U4743.json
          if-no-files-found: error
          retention-days: 7
