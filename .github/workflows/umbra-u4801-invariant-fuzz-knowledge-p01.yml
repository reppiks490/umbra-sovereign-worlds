# UMBRA U4801 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4801 | T8 metascience | invariant-fuzz | knowledge | precision 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4801-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4801 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4801 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4801-evidence"
          path: advanced-evidence/U4801.json
          if-no-files-found: error
          retention-days: 7
