# UMBRA U4903 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4903 | T8 metascience | robustness-dominance | population | precision 3"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4903-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4903 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4903 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4903-evidence"
          path: advanced-evidence/U4903.json
          if-no-files-found: error
          retention-days: 7
