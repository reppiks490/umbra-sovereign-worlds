# UMBRA U4912 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4912 | T8 metascience | robustness-dominance | population | regime-shift 4"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4912-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4912 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4912 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4912-evidence"
          path: advanced-evidence/U4912.json
          if-no-files-found: error
          retention-days: 7
