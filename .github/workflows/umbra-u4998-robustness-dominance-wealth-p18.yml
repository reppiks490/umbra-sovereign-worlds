# UMBRA U4998 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U4998 | T8 metascience | robustness-dominance | wealth | adversarial 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u4998-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U4998 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U4998 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u4998-evidence"
          path: advanced-evidence/U4998.json
          if-no-files-found: error
          retention-days: 7
