# UMBRA U5013 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U5013 | T8 metascience | robustness-dominance | knowledge | long-horizon 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u5013-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U5013 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U5013 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u5013-evidence"
          path: advanced-evidence/U5013.json
          if-no-files-found: error
          retention-days: 7
