# UMBRA U5090 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U5090 | T8 metascience | robustness-dominance | inequality | regime-shift 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u5090-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U5090 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U5090 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u5090-evidence"
          path: advanced-evidence/U5090.json
          if-no-files-found: error
          retention-days: 7
