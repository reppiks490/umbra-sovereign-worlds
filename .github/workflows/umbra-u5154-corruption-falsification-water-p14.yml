# UMBRA U5154 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U5154 | T8 metascience | corruption-falsification | water | long-horizon 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u5154-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U5154 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U5154 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u5154-evidence"
          path: advanced-evidence/U5154.json
          if-no-files-found: error
          retention-days: 7
