# UMBRA U5162 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U5162 | T8 metascience | corruption-falsification | energy | precision 2"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u5162-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U5162 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U5162 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u5162-evidence"
          path: advanced-evidence/U5162.json
          if-no-files-found: error
          retention-days: 7
