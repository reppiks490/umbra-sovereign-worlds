# UMBRA U5241 — bounded, manually invoked synthetic research case; no deployment/trading.
name: "U5241 | T8 metascience | corruption-falsification | carbon | precision 1"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "umbra-u5241-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Execute U5241 advanced synthetic experiment"
        run: node scripts/umbra_advanced_lab.mjs --id U5241 --out-dir advanced-evidence
      - name: Upload independent simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: "umbra-u5241-evidence"
          path: advanced-evidence/U5241.json
          if-no-files-found: error
          retention-days: 7
