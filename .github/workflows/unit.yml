name: UMBRA Sovereign Worlds verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Preserve complete, reviewable evidence for every commit; no cancellation of
# in-flight verification when another commit arrives.
concurrency:
  group: umbra-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determinism, civic economy, Reality Court
        run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop/tablet/phone smoke
        run: python tests/smoke.py
