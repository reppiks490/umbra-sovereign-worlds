name: UMBRA Sovereign Worlds verification
on:
  schedule:
    - cron: '17 5,17 * * *'
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determinism, civic economy, Reality Court
        run: npm test
      - name: Verify all 300 read-only UMBRA workflow definitions
        run: python3 scripts/validate_umbra_workflows.py
      - name: Exercise all 300 synthetic research/verification/evolution scenarios
        run: node scripts/umbra_lab.mjs --audit-all
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop/tablet/phone smoke
        run: python tests/smoke.py
      - name: Served ESM, real module Worker, protocol rejection and fallback
        run: python tests/served_smoke.py
